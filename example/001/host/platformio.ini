; M5Stack Core2 (ESP32) client for KagigataDisk.
;
; KagigataDisk plugs into the Core2's TF-card-shaped slot, used only as an SPI
; connector (SCK=18, MISO=38, MOSI=23, CS=4; the bus is shared with the LCD).
; All traffic with it goes through lib/emu_storage. The console and upload go
; through the on-board CP2104 UART bridge (10c4:ea60); tools/core2_flash.sh
; builds and flashes this env.
;
; protocol/emu_protocol_defs.h at the repository root is the wire definition
; shared with the firmware; lib/emu_storage keeps a copy, and check_protocol.py
; stops the build if the two differ (tools/sync_protocol.sh updates the copy).
[env:core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:check_protocol.py
lib_deps =
    m5stack/M5Unified @ ^0.2.21
test_speed = 115200
test_filter = test_device

; Protocol unit tests on the PC (no hardware): pio test -e native
[env:native]
platform = native
extra_scripts = pre:check_protocol.py
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/lib/emu_storage/src
lib_ignore = emu_storage
test_filter = test_protocol
